[build]
  base      = "frontend"
  command   = "npm install && npm run build"
  publish   = ".next"

[build.environment]
  NODE_VERSION             = "20"
  NPM_FLAGS                = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED  = "1"

# Next.js plugin — handles SSR, API routes, and image optimisation on Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# SPA-style catch-all: let Next.js handle all routing
[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/___netlify-handler"
  status = 200

[context.production.environment]
  NODE_ENV = "production"

[context.deploy-preview.environment]
  NODE_ENV = "production"
