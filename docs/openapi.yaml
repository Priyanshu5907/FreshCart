openapi: 3.0.3
info:
  title: FreshCart API
  description: |
    REST API for the FreshCart online grocery platform.
    
    ## Authentication
    Most endpoints require a JWT Bearer token obtained via `/api/auth/login` or `/api/auth/register`.
    Include it as: `Authorization: Bearer <token>`
    
    ## Roles
    - `customer` — can browse, cart, order, wishlist
    - `admin` — full platform management
    - `delivery_partner` — view assigned orders, update status
  version: 1.0.0
  contact:
    name: FreshCart API Support
    email: api@freshcart.example.com

servers:
  - url: http://localhost:3001/api
    description: Local development
  - url: https://api.freshcart.example.com/api
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        message:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [customer, admin, delivery_partner]
        isActive:
          type: boolean
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        price:
          type: number
        discountPct:
          type: number
        stockQty:
          type: integer
        isFeatured:
          type: boolean
        category:
          $ref: '#/components/schemas/Category'
        images:
          type: array
          items:
            type: object
            properties:
              url:
                type: string

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        imageUrl:
          type: string
          nullable: true

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [confirmed, processing, shipped, out_for_delivery, delivered, cancelled]
        paymentMethod:
          type: string
          enum: [upi, card, cod]
        subtotal:
          type: number
        discountAmount:
          type: number
        deliveryFee:
          type: number
        taxAmount:
          type: number
        total:
          type: number
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

paths:
  /health:
    get:
      summary: Health check
      tags: [System]
      responses:
        '200':
          description: All services healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  services:
                    type: object
                    properties:
                      database:
                        type: string
                      redis:
                        type: string
        '503':
          description: One or more services degraded

  /auth/register:
    post:
      summary: Register with email/password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: Alice Johnson
                email:
                  type: string
                  format: email
                  example: alice@example.com
                password:
                  type: string
                  minLength: 8
                  example: Password123!
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                          user:
                            $ref: '#/components/schemas/User'
        '400':
          description: Validation error
        '409':
          description: Email already registered

  /auth/login:
    post:
      summary: Login with email/password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New token pair issued
        '401':
          description: Invalid or expired refresh token

  /auth/logout:
    post:
      summary: Logout (invalidate refresh token)
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Logged out successfully

  /categories:
    get:
      summary: List active categories
      tags: [Products]
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'

  /products:
    get:
      summary: List/search/filter products
      tags: [Products]
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query (min 2 chars)
        - name: category
          in: query
          schema:
            type: string
          description: Category slug
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, rating_desc, newest]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated product list

  /products/featured:
    get:
      summary: Get featured products
      tags: [Products]
      responses:
        '200':
          description: Featured products list

  /products/deals:
    get:
      summary: Get deals of the day
      tags: [Products]
      responses:
        '200':
          description: Deals sorted by discount

  /products/{slug}:
    get:
      summary: Get product detail
      tags: [Products]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product detail
        '404':
          description: Product not found

  /cart:
    get:
      summary: Get cart
      tags: [Cart]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart with items and subtotal

  /cart/items:
    post:
      summary: Add item to cart
      tags: [Cart]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId:
                  type: string
                  format: uuid
                quantity:
                  type: integer
                  default: 1
      responses:
        '200':
          description: Item added

  /orders:
    get:
      summary: Get order history
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Paginated order history
    post:
      summary: Place order
      tags: [Orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addressId, deliverySlotId, paymentMethod]
              properties:
                addressId:
                  type: string
                  format: uuid
                deliverySlotId:
                  type: string
                  format: uuid
                paymentMethod:
                  type: string
                  enum: [upi, card, cod]
      responses:
        '201':
          description: Order placed
        '400':
          description: Validation error or out-of-stock items

  /orders/delivery-slots:
    get:
      summary: Get available delivery slots
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Available slots for next 7 days

  /payments/initiate:
    post:
      summary: Initiate Razorpay payment
      tags: [Payments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Razorpay order details

  /admin/dashboard:
    get:
      summary: Get admin dashboard stats
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard statistics
        '403':
          description: Admin role required

  /wishlist:
    get:
      summary: Get wishlist
      tags: [Wishlist]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wishlist items with current prices
    post:
      summary: Add to wishlist
      tags: [Wishlist]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Added to wishlist (idempotent)

  /delivery/orders:
    get:
      summary: Get assigned orders
      tags: [Delivery]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Assigned orders
        '403':
          description: Delivery partner role required

  /notifications/device-token:
    post:
      summary: Register device token
      tags: [Notifications]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                platform:
                  type: string
                  enum: [web, android, ios]
                  default: web
      responses:
        '200':
          description: Token registered

tags:
  - name: System
    description: Health and monitoring
  - name: Auth
    description: Authentication and authorization
  - name: Products
    description: Product catalog and search
  - name: Cart
    description: Shopping cart management
  - name: Orders
    description: Order placement and tracking
  - name: Payments
    description: Payment processing
  - name: Admin
    description: Admin panel APIs
  - name: Delivery
    description: Delivery partner APIs
  - name: Wishlist
    description: Wishlist management
  - name: Notifications
    description: Push notification management
